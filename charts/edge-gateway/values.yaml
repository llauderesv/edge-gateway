gateway:
  namespace: envoy-gateway-system
  gatewayClassName: eg
  # Applied to every listener unless the listener overrides allowedRoutes
  allowedRoutes:
    namespaces:
      from: All
  listeners:
    - name: http
      port: 80
      protocol: HTTP

envoyProxy:
  name: eg
  service:
    type: ClusterIP
  replicas: 2

gatewayClass:
  name: eg
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  # Linked to EnvoyProxy below (namespace filled at render from release ns)
  # parametersRef:
  #   group: gateway.envoyproxy.io
  #   kind: EnvoyProxy
  #   name: eg
  annotations: {}