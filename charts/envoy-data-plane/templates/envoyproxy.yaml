apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.envoyProxy.name }}
  namespace: {{ .Values.gateway.namespace }}
  labels:
    app.kubernetes.io/instance: {{ .Values.envoyProxy.name }}
    app.kubernetes.io/component: proxy
    app.kubernetes.io/managed-by: {{ .Release.Name }}
    app.kubernetes.io/name: envoy
    argocd.argoproj.io/instance: {{ .Release.Name }}
    gateway.envoyproxy.io/owning-gateway-name: {{ .Values.gateway.name }}
    gateway.envoyproxy.io/owning-gateway-namespace: {{ .Values.gateway.namespace }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        {{ with .Values.envoyProxy.deployment.name }}
        name: {{ . }}
        {{ end }}
        replicas: {{ .Values.envoyProxy.replicas }}
        patch:
          type: StrategicMerge
          value:
            metadata:
              namespace: {{ .Values.gateway.namespace }}
              labels:
                app.kubernetes.io/instance: {{ .Values.envoyProxy.name }}
                app.kubernetes.io/component: proxy
                app.kubernetes.io/managed-by: {{ .Release.Name }}
                app.kubernetes.io/name: envoy
                argocd.argoproj.io/instance: {{ .Release.Name }}
                gateway.envoyproxy.io/owning-gateway-name: {{ .Values.gateway.name }}
                gateway.envoyproxy.io/owning-gateway-namespace: {{ .Values.gateway.namespace }}
      envoyService:
        type: {{ .Values.envoyProxy.service.type }}
        {{ with .Values.envoyProxy.service.name }}
        name: {{ . }}
        {{ end }}
  telemetry:
    accessLog:
      settings:
      - sinks:
        - type: File
          file:
            path: /dev/stdout
