apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "edge-service.fullname" . }}
  namespace: {{ .Values.service.namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.name }}
      namespace: {{ .Values.gateway.namespace }}
  hostnames:
    {{- range .Values.route.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: {{ .Values.route.pathType }}
            value: {{ .Values.route.path }}
      {{- if or .Values.route.rewrite.hostname .Values.route.rewrite.path.type }}
      filters:
        - type: URLRewrite
          urlRewrite:
            {{- with .Values.route.rewrite.hostname }}
            hostname: {{ . | quote }}
            {{- end }}
            {{- with .Values.route.rewrite.path.type }}
            path:
              type: {{ . }}
              {{- if eq . "ReplacePrefixMatch" }}
              replacePrefixMatch: {{ $.Values.route.rewrite.path.replacePrefixMatch | quote }}
              {{- end }}
            {{- end }}
      {{- end }}
      backendRefs:
        {{- if eq .Values.backend.type "kubernetes" }}
        - group: ""
          kind: Service
          name: {{ .Values.backend.service.name }}
          port: {{ .Values.backend.service.port }}
        {{- else if eq .Values.backend.type "external" }}
        - group: gateway.envoyproxy.io
          kind: Backend
          name: {{ include "edge-service.backendName" . }}
        {{- end }}
