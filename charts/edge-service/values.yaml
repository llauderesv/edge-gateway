service:
  name: ""
  namespace: default

backend:
  name: ""
  port: 80

gateway:
  name: envoy-data-plane-dev
  namespace: envoy-gateway-system

route:
  hostnames: []
  path: /
  pathType: PathPrefix
  # Optional upstream request rewrites. Omit to preserve the original host and path.
  rewrite:
    hostname: ""
    path:
      type: ""
      replacePrefixMatch: ""

rateLimit:
  enabled: false
  requests: 100
  unit: Minute

timeouts:
  enabled: false
  request: 15s

security:
  enabled: false
