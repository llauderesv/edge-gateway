apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway-addons
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/llauderesv/edge-gateway.git
    targetRevision: HEAD
    path: infrastructure/envoy-gateway-addons
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
