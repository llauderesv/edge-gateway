grafana:
  enabled: true

  admin:
    existingSecret: monitoring-grafana

  service:
    type: ClusterIP

prometheus:
  enabled: true

  prometheusSpec:
    retention: 7d

    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 2Gi

alertmanager:
  enabled: true

  alertmanagerSpec:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true