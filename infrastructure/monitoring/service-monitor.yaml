apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: envoy-gateway
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/managed-by=envoy-gateway
      app.kubernetes.io/name=envoy
      gateway.envoyproxy.io/owning-gateway-name=edge-gateway-dev
  namespaceSelector:
    matchNames:
      - envoy-gateway-system
  endpoints:
    - port: admin
      path: /stats/prometheus
      interval: 15s