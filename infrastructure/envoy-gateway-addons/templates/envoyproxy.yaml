apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: {{ .Values.envoyProxy.name }}
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        patch:
          type: StrategicMerge
          value:
            metadata:
              labels:
                app.kubernetes.io/instance: {{ .Release.Name }}
              #annotations:
              #  argocd.argoproj.io/tracking-id: envoy-gateway-addons:apps/Deployment:envoy-gateway-system/envoy-proxy
      envoyService:
        type: {{ .Values.envoyProxy.service.type }}
  telemetry:
    accessLog:
      settings:
      - sinks:
        - type: File
          file:
            path: /dev/stdout