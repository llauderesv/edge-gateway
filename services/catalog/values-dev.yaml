backend:
  external:
    # Resolve to the Docker host from the edge-gateway Minikube cluster.
    # The host port-forward exposes the other cluster's Istio ingress here.
    host: host.minikube.internal

route:
  # Istio selects the catalog virtual host using this Host header.
  rewrite:
    hostname: homelab.local

gateway:
  name: envoy-data-plane-dev
  namespace: envoy-gateway-system
